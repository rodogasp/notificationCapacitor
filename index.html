<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
  </head>
  <body>
    <main>
      <h1>Welcome</h1>
      <p>Background audio playback test application.</p>
      <input id="media-file" type="file" accept=".mkv,video/x-matroska,audio/*" />
      <p id="selected-file">No media file selected.</p>
      <button id="play-audio">Play Audio</button>
      <button id="stop-audio">Stop Audio</button>
      <audio id="audio-player" controls></audio>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
