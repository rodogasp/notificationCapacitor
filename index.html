<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
  </head>
  <body>
    <main>
      <h1>Welcome</h1>
      <p>Select media to play audio in the background.</p>
      <button id="media-file">Select Media</button>
      <p id="selected-file">No media file selected.</p>
      <button id="show-notification">Display Media Notification</button>
      <button id="play-audio">Play Audio</button>
      <button id="stop-audio">Stop Audio</button>
      <button id="start-service">Start Foreground Service</button>
      <button id="stop-service">Stop Foreground Service</button>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
