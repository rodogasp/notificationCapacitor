<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1565c0" />
    <title>FCM Test App</title>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>FCM Test App</h1>
        <p id="status" class="status">Starting...</p>

        <div class="field">
          <label for="backend-url">Backend base URL</label>
          <input id="backend-url" type="url" placeholder="https://device.example.test" autocomplete="url" />
          <div class="help">Do not use localhost on a physical device. Use your computer LAN IP, 10.0.2.2 for the Android emulator, or deployed HTTPS.</div>
        </div>
        <div class="field">
          <label for="bearer-token">Optional Bearer token</label>
          <input id="bearer-token" type="password" placeholder="Paste a test JWT if required" autocomplete="off" />
          <div class="help">Proof of concept only. Do not use production credentials here; use secure storage in production.</div>
        </div>

        <div class="actions">
          <button id="initialize">Initialize Notifications</button>
          <button id="register-token">Register Token With Backend</button>
          <button id="copy-token">Copy FCM Token</button>
          <button id="local-test">Send Local Test Notification</button>
          <button id="clear-logs" class="secondary">Clear Logs</button>
        </div>

        <div class="field">
          <label for="fcm-token">Current FCM registration token</label>
          <input id="fcm-token" type="text" readonly placeholder="Not registered yet" />
        </div>
        <div class="field">
          <label for="logs">Event log</label>
          <textarea id="logs" readonly aria-label="Timestamped event log"></textarea>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
