<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
  </head>
  <body>
    <main>
      <h1>Welcome</h1>
      <p>Select a video file to play it in the browser.</p>
      <input id="media-file" type="file" accept="video/*,.mkv,video/x-matroska,application/octet-stream" />
      <p id="selected-file">No media file selected.</p>
      <video id="video-player" controls playsinline></video>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
