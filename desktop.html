<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notification Console</title>
  </head>
  <body class="desktop-body">
    <main class="desktop-shell">
      <header class="desktop-header">
        <div>
          <p class="eyebrow">Desktop Operator</p>
          <h1>Call Notification Console</h1>
        </div>
        <p id="desktop-status" class="desktop-status">Ready</p>
      </header>

      <section class="desktop-grid">
        <section class="desktop-form">
          <label for="desktop-backend-url">Backend URL</label>
          <input id="desktop-backend-url" type="url" />

          <label for="desktop-bearer-token">Bearer token</label>
          <input id="desktop-bearer-token" type="password" />

          <label for="desktop-user-id">Target user ID</label>
          <input id="desktop-user-id" value="user-1" />

          <label for="desktop-caller-name">Caller name</label>
          <input id="desktop-caller-name" value="Ada Lovelace" />

          <div class="desktop-actions">
            <button id="desktop-use-dev-token" class="secondary" type="button">Use Dev Token</button>
            <button id="desktop-send-call" type="button">Send Incoming Call</button>
          </div>
        </section>

        <section class="desktop-result">
          <h2>Delivery Result</h2>
          <pre id="desktop-result">No notification sent yet.</pre>
        </section>

        <section class="desktop-server-logs">
          <div class="desktop-log-heading">
            <h2>Lifetime Server Logs</h2>
            <button id="desktop-clear-logs" class="secondary" type="button">Clear Logs</button>
          </div>
          <pre id="desktop-server-logs">WebSocket lifecycle is displayed in the FCM Test App.</pre>
        </section>
      </section>
    </main>
    <script type="module" src="/src/desktop.ts"></script>
  </body>
</html>
