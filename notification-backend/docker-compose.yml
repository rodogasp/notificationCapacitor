version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notification_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notification_pass}
      POSTGRES_DB: ${POSTGRES_DB:-notification_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-notification_user}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-notification_user}:${POSTGRES_PASSWORD:-notification_pass}@postgres:5432/${POSTGRES_DB:-notification_db}?schema=public
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CREDENTIALS_MODE: ${FIREBASE_CREDENTIALS_MODE:-adc}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FCM_ANDROID_CHANNEL_ID: ${FCM_ANDROID_CHANNEL_ID:-default_channel}
      # Safe out-of-the-box local defaults; override in .env for real deployments.
      JWT_ISSUER: ${JWT_ISSUER:-https://local-dev-issuer/}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-notification-backend-local}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-local-dev-only-shared-secret-change-me}
      NOTIFICATION_REQUIRED_ROLE: ${NOTIFICATION_REQUIRED_ROLE:-notification:send}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      MAX_JSON_BODY_SIZE: ${MAX_JSON_BODY_SIZE:-100kb}
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
